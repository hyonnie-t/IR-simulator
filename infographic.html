<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숫자로 보는 산업 혁명</title>
<style>
/* Nuri 구조(팔레트 → 의미 토큰 → 컴포넌트). 브랜드 팔레트 sea를 «쪽빛(indigo)»으로 변주:
   면직물 염색(160쪽 «염색이 잘 되고»)의 남색, 흰 무명, 하늘색 증기, 목화 꽃받침의 금빛 노랑(강조). */
:root {
  --gray-00:#ffffff; --gray-100:#f7f9fc; --gray-200:#f1f4f7; --gray-300:#e5e8eb;
  --gray-600:#727577; --gray-700:#5b5e60; --gray-800:#434548; --gray-1000:#17181b;
  --indigo-100:#eef1fb; --indigo-200:#dde3f6; --indigo-300:#bcc8ee; --indigo-500:#6077cc;
  --indigo-700:#3a4a9c; --indigo-900:#222c5e; --indigo-1000:#161d40;
  --sky-100:#eaf1fb; --sky-300:#c3d6f2; --sky-500:#8fb3e8;
  --gold-100:#fdf1d3; --gold-500:#f2b134; --gold-700:#b07a12;
  --steam-300:#c9d3dc; --steam-700:#4f5f6e;

  --fg-neutral:var(--gray-1000); --fg-neutral-muted:var(--gray-800); --fg-neutral-subtle:var(--gray-700);
  --fg-brand:var(--indigo-700); --fg-brand-contrast:var(--indigo-900);
  --bg-page:var(--sky-100); --bg-layer-default:var(--gray-00);
  --bg-brand-weak:var(--indigo-100); --bg-brand-deep:var(--indigo-1000); --bg-neutral-weak:var(--gray-200);
  --bg-accent:var(--gold-500); --bg-accent-weak:var(--gold-100); --fg-on-accent:var(--indigo-1000);
  --stroke-neutral-subtle:var(--gray-300); --stroke-neutral-muted:var(--gray-600);
  --viz-brand:var(--indigo-700); --viz-brand-soft:var(--indigo-300); --viz-steam:var(--steam-700); --viz-steam-soft:var(--steam-300);
  --thread:var(--indigo-700);
  --cloth-hi:#6077cc; --cloth:#3a4a9c; --cloth-lo:#222c5e; --wood:#a8703c;
  --on-solid:#ffffff; --on-solid-muted:#d2daf5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --gray-00:#000000; --gray-100:#111417; --gray-200:#191c1f; --gray-300:#24272a;
    --gray-600:#83868a; --gray-700:#9b9fa3; --gray-800:#babec2; --gray-1000:#f0f4f8;
    --indigo-100:#161b33; --indigo-300:#3a4a86; --indigo-700:#9aaae6; --indigo-900:#d2daf5; --indigo-1000:#0d1126;
    --sky-100:#0b0f1d; --steam-300:#3c4652; --steam-700:#a9b6c3;
    --bg-layer-default:var(--gray-100); --bg-accent-weak:#3a2e10; --fg-on-accent:#161d40;
    --cloth-hi:#a4b2ea; --cloth:#7487d4; --cloth-lo:#4d5fb0; --wood:#c99a6c;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0; background:var(--bg-page); color:var(--fg-neutral);
  font-family:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size:17px; line-height:1.6; word-break:keep-all; overflow-wrap:break-word;
}
img { display:block; max-width:100%; height:auto; }

/* ── 머리: 포스터 제목 + 실패 그림 ── */
.hero { position:relative; background:var(--bg-brand-deep); color:var(--on-solid); overflow:hidden; }
.hero::after { /* 아래쪽 물결(천 끝단) */
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:28px;
  background:radial-gradient(circle at 14px 0, transparent 13px, var(--bg-page) 14px) 0 0/28px 28px repeat-x;
}
.hero-in { max-width:980px; margin:0 auto; padding:28px 16px 44px; display:grid; gap:4px 24px; align-items:center; }
.tag { display:inline-block; padding:4px 12px; border-radius:9999px; background:var(--bg-accent); color:var(--fg-on-accent); font-size:15px; font-weight:800; letter-spacing:0.04em; }
.hero h1 { font-size:36px; line-height:1.15; margin:12px 0 10px; font-weight:900; letter-spacing:-0.02em; }
.hero h1 em { font-style:normal; color:var(--gold-500); }
.hero .lead { margin:0; font-size:18px; color:var(--on-solid-muted); }
.hero-art { max-width:340px; justify-self:center; filter:drop-shadow(0 10px 18px rgba(0,0,0,0.35)); }

/* ── 한눈에 보기: 다섯 숫자 ── */
.glance { max-width:980px; margin:8px auto 0; padding:0 16px; }
.glance h2 { font-size:16px; font-weight:800; color:var(--fg-brand); letter-spacing:0.06em; margin:0 0 10px; }
.glance ol { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
.glance li:last-child { grid-column:1 / -1; }
.glance a {
  display:flex; flex-direction:column; align-items:flex-start; gap:6px; min-height:76px; padding:12px 14px; border-radius:16px;
  background:var(--bg-layer-default); color:inherit; text-decoration:none; box-shadow:0 2px 0 var(--sky-300);
}
.glance a:focus-visible { outline:3px solid var(--fg-brand); outline-offset:2px; }
.glance .no { flex:none; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--bg-accent); color:var(--fg-on-accent); font-weight:900; font-size:15px; }
.glance .v { display:block; font-size:24px; line-height:1.15; font-weight:900; color:var(--fg-brand); white-space:nowrap; }
.glance .l { display:block; font-size:14px; color:var(--fg-neutral-muted); line-height:1.35; }

/* ── 본문: 실 한 가닥이 01→05를 꿴다 ── */
.road { position:relative; max-width:980px; margin:0 auto; padding:28px 16px 40px 56px; }
.road::before { /* 실: 쪽빛 굵은 줄 + 흰 바늘땀 */
  content:""; position:absolute; left:27px; top:0; bottom:60px; width:6px; border-radius:3px;
  background:repeating-linear-gradient(180deg, var(--thread) 0 14px, var(--sky-300) 14px 20px);
}
.panel { position:relative; margin:0 0 44px; scroll-margin-top:12px; }
.pin { /* 번호 배지(실에 꿴 단추) */
  position:absolute; left:-50px; top:-6px; width:52px; height:52px; border-radius:50%;
  display:grid; place-items:center; background:var(--bg-accent); color:var(--fg-on-accent);
  font-weight:900; font-size:19px; letter-spacing:0.02em; border:4px solid var(--bg-page);
  box-shadow:0 0 0 3px var(--thread);
}
.card {
  background:var(--bg-layer-default); border-radius:24px; padding:18px 18px 20px;
  box-shadow:0 3px 0 var(--sky-300), 0 12px 30px rgba(34,44,94,0.08);
}
.art { margin:-4px auto 6px; max-width:360px; }
.art img { width:100%; }
.art figcaption { text-align:center; font-size:13px; color:var(--fg-neutral-subtle); margin-top:2px; }
.panel-head { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:2px; }
.num { font-size:14px; font-weight:900; color:var(--fg-brand); letter-spacing:0.08em; }
.badge { display:inline-flex; align-items:center; min-height:28px; padding:2px 10px; border-radius:9999px; font-size:16px; font-weight:600; line-height:1.4; }
.badge.tb { background:var(--bg-brand-weak); color:var(--fg-brand-contrast); }
.badge.out { background:var(--bg-neutral-weak); color:var(--fg-neutral-muted); border:1px dashed var(--stroke-neutral-muted); }
h2.t { font-size:24px; line-height:1.3; margin:6px 0 10px; font-weight:900; letter-spacing:-0.01em; }
/* 숫자 리본 */
.stat { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin:4px 0 16px; }
.stat .v {
  position:relative; display:inline-block; padding:4px 22px 6px 16px; background:var(--bg-accent); color:var(--fg-on-accent);
  font-size:38px; line-height:1.1; font-weight:900; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; white-space:nowrap;
  clip-path:polygon(0 0, 100% 0, calc(100% - 12px) 50%, 100% 100%, 0 100%);
}
.stat .l { font-size:16px; color:var(--fg-neutral-muted); font-weight:600; }
.viz { margin:4px 0 14px; padding:14px; border-radius:16px; background:var(--bg-page); }
.viz svg { display:block; width:100%; height:auto; }
.label { font-size:16px; color:var(--fg-neutral-muted); margin:0; }
.note { font-size:15px; color:var(--fg-neutral-subtle); margin:8px 0 0; }
.source { font-size:14px; color:var(--fg-neutral-subtle); margin:12px 0 0; line-height:1.5; }
.ask {
  position:relative; margin-top:16px; padding:16px 16px 16px 16px; border-radius:18px;
  background:var(--bg-brand-weak); color:var(--fg-brand-contrast); border:2px solid var(--viz-brand-soft);
}
.ask::before { /* 말풍선 꼬리 */
  content:""; position:absolute; left:26px; top:-10px; width:18px; height:18px; background:var(--bg-brand-weak);
  border-left:2px solid var(--viz-brand-soft); border-top:2px solid var(--viz-brand-soft); transform:rotate(45deg);
}
.ask b { display:flex; align-items:center; gap:6px; font-size:15px; margin-bottom:4px; }
.ask p { margin:0; font-size:18px; font-weight:600; line-height:1.55; }

/* P1 실패 */
.dots svg { max-width:480px; margin:0 auto; }
/* P2 옷감 막대 */
.unit { font-size:15px; color:var(--fg-neutral-subtle); margin:0 0 10px; }
.bars { display:grid; gap:14px; }
.bar-row { display:grid; grid-template-columns:6.4em 1fr; gap:4px 10px; align-items:center; }
.bar-name { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.25; }
.bar-name svg { flex:none; width:30px; height:30px; }
.bar-name small { display:block; font-weight:500; font-size:14px; color:var(--fg-neutral-subtle); }
.bar-track { position:relative; height:36px; border-left:2px solid var(--stroke-neutral-muted);
  background:repeating-linear-gradient(90deg, var(--stroke-neutral-subtle) 0 1px, transparent 1px 10%); }
.bar { height:100%; min-width:1px; border-radius:0 4px 4px 0;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.16) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0 1px, transparent 1px 4px),
    linear-gradient(180deg, var(--cloth-hi), var(--cloth) 55%, var(--cloth-lo));
  box-shadow:inset 0 -3px 0 rgba(0,0,0,0.18); }
.bar.wool { background:
    radial-gradient(circle at 3px 3px, var(--viz-steam-soft) 1.6px, transparent 2.2px) 0 0/6px 6px,
    var(--viz-steam); box-shadow:none; }
.bar-val { grid-column:2; font-size:16px; }
.bar-val strong { font-size:19px; font-variant-numeric:tabular-nums; }
.bar-val .x { display:inline-block; margin-left:8px; padding:0 8px; border-radius:6px; background:var(--bg-accent-weak); color:var(--fg-brand-contrast); font-weight:800; font-size:15px; }
.compare { display:flex; align-items:center; gap:10px; margin:0; padding:10px 12px; border-radius:12px; background:var(--bg-accent-weak); font-weight:700; color:var(--fg-brand-contrast); }
.compare svg { flex:none; width:28px; height:28px; }
/* P3 철길 */
.rail { display:grid; gap:16px; }
.rail-row .rl { display:flex; flex-wrap:wrap; gap:0 10px; align-items:center; }
.rail-row .rl svg { width:44px; height:26px; }
.rail-row .rl strong { font-size:20px; font-variant-numeric:tabular-nums; }
.viz .rail-line { height:20px; border-left:2px solid var(--stroke-neutral-muted); margin-top:6px; }
/* P4·P5 */
.fact { font-size:18px; line-height:1.6; margin:0; }
.fact strong { color:var(--fg-brand); }
.halves { display:flex; justify-content:center; gap:10px; margin:6px 0 0; }
.halves span { display:inline-flex; align-items:center; gap:6px; padding:4px 14px; border-radius:9999px; font-weight:800; font-size:16px; }
.halves span:first-child { background:var(--bg-brand-weak); color:var(--fg-brand-contrast); }
.halves span:last-child { background:#e3f1dd; color:#24451b; }
.crowd { display:flex; justify-content:center; align-items:flex-end; gap:6px; }
.crowd .person { position:relative; flex:1 1 0; max-width:120px; display:flex; flex-direction:column; align-items:center; }
.crowd .person img { height:150px; width:auto; max-width:100%; object-fit:contain; }
.crowd .person:not(.on) img { filter:grayscale(1) brightness(1.15); opacity:0.38; }
.crowd .person span { min-height:24px; margin-top:4px; padding:0 10px; border-radius:9999px; font-size:14px; font-weight:800; }
.crowd .person.on span { background:var(--bg-accent); color:var(--fg-on-accent); }
@media (min-width:768px) { .crowd .person img { height:180px; } }
.legend { list-style:none; margin:10px 0 0; padding:0; font-size:15px; color:var(--fg-neutral-muted); }
.legend li { display:flex; align-items:center; gap:8px; margin-top:4px; }
.legend i { flex:none; width:18px; height:18px; border-radius:4px; border:2px solid var(--fg-neutral); }
.legend .fill { background:linear-gradient(135deg, var(--gold-500) 50%, var(--indigo-700) 50%); border-color:var(--fg-neutral); }
.legend .rest { background:var(--gray-300); border-color:var(--stroke-neutral-muted); opacity:0.7; }
.closing .card { background:var(--bg-brand-deep); color:var(--on-solid); text-align:center; padding:28px 20px; }
.closing h2.t { color:var(--gold-500); }
.closing p { margin:0; font-size:20px; font-weight:700; }
.foot { font-size:13px; color:var(--fg-neutral-subtle); text-align:center; margin:0; padding:0 16px 32px; }
@media (prefers-color-scheme: dark) {
  .halves span:last-child { background:#1f3319; color:#cfe8c4; }
}

@media (min-width:768px) {
  body { font-size:18px; }
  .hero-in { grid-template-columns:1.2fr 1fr; padding:44px 24px 64px; }
  .hero h1 { font-size:56px; }
  .glance { padding:0 24px; }
  .glance ol { grid-template-columns:repeat(5, 1fr); }
  .glance li:last-child { grid-column:auto; }
  .glance a { min-height:130px; }
  .road { padding:40px 24px 48px 84px; }
  .road::before { left:49px; }
  .pin { left:-62px; width:60px; height:60px; font-size:21px; }
  .card { padding:24px 28px 26px; }
  h2.t { font-size:28px; }
  .stat .v { font-size:56px; }
}
@media (min-width:1024px) {
  /* 가로 태블릿: 그림과 내용을 좌우로, 패널마다 번갈아 */
  .panel:not(.closing) .card { display:grid; grid-template-columns:38% 1fr; gap:0 28px; align-items:start; }
  .panel:not(.closing):nth-of-type(even) .card { grid-template-columns:1fr 38%; }
  .panel:not(.closing):nth-of-type(even) .art { order:2; }
  .art { margin:0; max-width:none; position:sticky; top:16px; }
}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div>
      <span class="tag" id="kicker"></span>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="hero-art" id="heroFig"></div>
  </div>
</header>
<nav class="glance" aria-labelledby="glanceH"><h2 id="glanceH"></h2><ol id="strip"></ol></nav>
<main class="road" id="panels"></main>
<noscript><p>이 자료는 브라우저의 자바스크립트가 켜져 있어야 보여요.</p></noscript>

function el(tag, attrs, ...kids) {

  s.append(svg('line', { x1: xB - gap / 2, x2: xB - gap / 2, y1: 0, y2: hGrid, stroke: 'var(--stroke-neutral-muted)', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }));
  const label = (x, anchor, a, b) => {
    const t1 = svg('text', { x, y: hGrid + 22, 'text-anchor': anchor, 'font-size': 15, fill: 'var(--fg-neutral-muted)' }); t1.textContent = a;
    const t2 = svg('text', { x, y: hGrid + 46, 'text-anchor': anchor, 'font-size': 22, 'font-weight': 900, fill: 'var(--fg-neutral)' }); t2.textContent = b;
    s.append(t1, t2);
  };
  label(0, 'start', p.before.label, p.before.count + p.unit);
  label(w, 'end', p.after.label, p.after.count + p.unit);
  return s;
}
function renderP1() {
  const p = DATA.p1;
  return panel(1, p, [stat(p.ratio, p.ratioLabel), el('div', { class: 'viz dots' }, spoolChart(p)), ask(p.question)]);
}
// 이름 칸 아이콘(막대 길이와 무관): 원면 = 목화송이, 양모 = 털실 뭉치
function cottonIcon() {
  const s = svg('svg', { viewBox: '0 0 32 32', 'aria-hidden': 'true' });
  [[16, 11], [10, 18], [22, 18], [16, 22]].forEach(([cx, cy]) =>
    s.append(svg('circle', { cx, cy, r: 6.5, fill: '#ffffff', stroke: 'var(--viz-brand)', 'stroke-width': 1.6 })));
  s.append(svg('path', { d: 'M16 25 L16 31 M12 29 L20 29', stroke: 'var(--gold-700)', 'stroke-width': 2, 'stroke-linecap': 'round' }));
  return s;
}
function woolIcon() {
  return svg('svg', { viewBox: '0 0 32 32', 'aria-hidden': 'true' },
    svg('circle', { cx: 15, cy: 17, r: 11, fill: 'var(--viz-steam-soft)', stroke: 'var(--viz-steam)', 'stroke-width': 1.8 }),
    svg('path', { d: 'M6 13 Q15 9 24 14 M5 19 Q15 14 26 19 M8 25 Q16 20 24 24', fill: 'none', stroke: 'var(--viz-steam)', 'stroke-width': 1.5 }),
    svg('path', { d: 'M25 23 Q30 26 29 31', fill: 'none', stroke: 'var(--viz-steam)', 'stroke-width': 1.6, 'stroke-linecap': 'round' }));
}
function barRow(name, sub, value, max, text, ratio, wool) {
  const pct = (value / max * 100).toFixed(2);
  return el('div', { class: 'bar-row' },
    el('div', { class: 'bar-name' }, wool ? woolIcon() : cottonIcon(), el('span', {}, name, el('small', {}, sub))),
    el('div', { class: 'bar-track', 'aria-hidden': 'true' },
      el('div', { class: 'bar' + (wool ? ' wool' : ''), style: `width:${pct}%` })),
    el('div', { class: 'bar-val' }, el('strong', {}, text), ratio ? el('span', { class: 'x' }, ratio) : null));
}
function renderP2() {
  const p = DATA.p2, max = Math.max(...p.cotton.map(c => c.value), p.wool.value);
  const bars = el('div', { class: 'bars' },
    ...p.cotton.map(c => barRow(String(c.year), p.cottonName, c.value, max, c.text, c.ratio)),
    barRow(String(p.wool.year), p.wool.name, p.wool.value, max, p.wool.text, '', true));
  return panel(2, p, [stat(p.headline, p.headlineLabel), el('p', { class: 'unit' }, p.unit), el('div', { class: 'viz' }, bars),
    el('p', { class: 'compare' }, cottonIcon(), p.compare), el('p', { class: 'source' }, p.source), ask(p.question)]);
}
function trainIcon() {
  return svg('svg', { viewBox: '0 0 44 26', 'aria-hidden': 'true' },
    svg('path', { d: 'M8 4 h5 v5 h-5z', fill: 'var(--fg-brand)' }),
    svg('rect', { x: 4, y: 9, width: 22, height: 9, rx: 4, fill: 'var(--fg-brand)' }),
    svg('rect', { x: 24, y: 5, width: 12, height: 13, rx: 1.5, fill: 'var(--fg-brand)' }),
    svg('rect', { x: 27, y: 8, width: 6, height: 4, fill: 'var(--bg-page)' }),
    svg('circle', { cx: 10, cy: 20, r: 4, fill: 'var(--gold-500)', stroke: 'var(--fg-brand)', 'stroke-width': 2 }),
    svg('circle', { cx: 30, cy: 20, r: 4, fill: 'var(--gold-500)', stroke: 'var(--fg-brand)', 'stroke-width': 2 }));
}
function renderP3() {
  const p = DATA.p3, max = Math.max(...p.rows.map(r => r.value));
  const rows = el('div', { class: 'rail' }, ...p.rows.map(r => {
    // 철길 길이 = 값 비례 그대로(끝 장식 없음). 레일 두 줄 + 침목. 높이만 CSS로 고정한다.
    const W = 600, len = r.value / max * W;
    const line = svg('svg', { class: 'rail-line', viewBox: `0 0 ${W} 20`, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    for (let x = 1; x < len - 1; x += 9) line.append(svg('rect', { class: 'tie', x, y: 0, width: 3, height: 20, fill: 'var(--wood)' }));
    line.append(
      svg('rect', { class: 'track', x: 0, y: 4, width: len.toFixed(2), height: 3.5, fill: 'var(--fg-brand)' }),
      svg('rect', { x: 0, y: 12.5, width: len.toFixed(2), height: 3.5, fill: 'var(--fg-brand)' }));
    return el('div', { class: 'rail-row' },
      el('div', { class: 'rl' }, trainIcon(), el('span', { class: 'label' }, r.year + '년'), el('strong', {}, r.text),
        r.sub ? el('span', { class: 'note' }, r.sub) : null), line);
  }));
  return panel(3, p, [stat(p.ratio, p.ratioLabel), el('div', { class: 'viz' }, rows),
    el('p', { class: 'note' }, p.link), el('p', { class: 'source' }, p.source), ask(p.question)]);
}
function renderP4() {
  const p = DATA.p4;
  const halves = el('p', { class: 'halves' }, ...p.halves.map(h => el('span', {}, h)));
  const sec = panel(4, p, [stat(p.caption, p.captionLabel), el('p', { class: 'fact' }, el('strong', {}, p.year + '년 '), p.text),
    el('p', { class: 'note' }, p.link), el('p', { class: 'source' }, p.source), ask(p.question)]);
  sec.querySelector('.art figcaption').before(halves);
  return sec;
}
// 관람객 그림 den(3)명 중 num(1)명만 색으로, 나머지는 흐린 회색으로 둔다.
function people() {
  const sh = DATA.p5.share, order = ['lady', 'man', 'lady'];
  const row = el('div', { class: 'crowd', role: 'img', 'aria-label': sh.text });
  for (let i = 0; i < sh.den; i++) {
    const on = i < sh.num, im = IMG[order[i % order.length]];
    row.append(el('div', { class: on ? 'person on' : 'person' },
      el('img', { src: im.src, width: im.w, height: im.h, alt: '' }),
      el('span', {}, on ? sh.onTag : sh.offTag)));
  }
  return row;
}
function renderP5() {
  const p = DATA.p5;
  const legend = el('ul', { class: 'legend' },
    el('li', {}, el('i', { class: 'fill', 'aria-hidden': 'true' }), p.share.fillLabel),
    el('li', {}, el('i', { class: 'rest', 'aria-hidden': 'true' }), p.share.wholeLabel));
  return panel(5, p, [stat(p.visitors, p.visitorsLabel),
    el('div', { class: 'viz people' }, people(), legend),
    el('p', { class: 'fact' }, p.share.text, ' ', badge(p.share.badge)),
    el('p', { class: 'note' }, p.exhibits), el('p', { class: 'source' }, p.source), ask(p.question)]);
}
function renderClosing() {
  const c = DATA.closing;
  return el('section', { class: 'panel closing', 'aria-labelledby': 'h6' },
    el('div', { class: 'card' }, el('h2', { class: 't', id: 'h6' }, c.title), el('p', {}, c.question)));
}
function renderStrip() {
  const items = [
    [1, DATA.p1.ratio, DATA.p1.strip], [2, DATA.p2.headline, DATA.p2.strip], [3, DATA.p3.ratio, DATA.p3.strip],
    [4, DATA.p4.caption, DATA.p4.strip], [5, DATA.p5.visitors, DATA.p5.strip]
  ];
  return items.map(([n, v, l]) => el('li', {}, el('a', { href: '#p' + n },
    el('span', { class: 'no', 'aria-hidden': 'true' }, pad2(n)), el('span', {}, el('span', { class: 'v' }, v), el('span', { class: 'l' }, l)))));
}
document.getElementById('kicker').textContent = DATA.kicker;
document.getElementById('title').append(el('em', {}, DATA.title[0]), DATA.title[1]);
document.getElementById('lead').textContent = DATA.lead;
document.getElementById('heroFig').append(el('img', { src: IMG.hero.src, width: IMG.hero.w, height: IMG.hero.h, alt: DATA.hero.alt }));
document.getElementById('glanceH').textContent = DATA.glance;
document.getElementById('strip').append(...renderStrip());
document.getElementById('panels').append(renderP1(), renderP2(), renderP3(), renderP4(), renderP5(), renderClosing());
document.body.append(el('p', { class: 'foot' }, DATA.foot));
</script>
</body>
